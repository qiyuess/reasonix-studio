<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://id.reasonix.io" crossorigin />
    <link rel="preconnect" href="https://remote.reasonix.io" crossorigin />
    <link rel="dns-prefetch" href="//id.reasonix.io" />
    <link rel="dns-prefetch" href="//remote.reasonix.io" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#07080c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Reasonix" />
    <title>Reasonix Studio</title>
    <script>
      // The boot screen below is painted by this file, before the bundle that
      // would otherwise decide these two exists. Mirrors App.tsx's "rx-theme"
      // and i18n.resolve — a wrong guess here only mis-tints one frame.
      (function () {
        try {
          var t = localStorage.getItem("rx-theme");
          if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
          var p = (localStorage.getItem("rx-lang") || "").trim().toLowerCase();
          var zh = p === "zh" || (p !== "en" && /^(zh|yue|cmn)/i.test(navigator.language || ""));
          document.documentElement.lang = zh ? "zh-CN" : "en";
        } catch (e) {}
      })();

      // A shared serve link carries its credential in the fragment, which the
      // browser never sends. Trading it for the cookie has to happen before the
      // bundle makes its first request, and the fragment is wiped from the
      // address bar and history on the way past so it cannot be copied on.
      // A scanned pairing link carries a one-time code the same way.
      window.__rxAuth = (function () {
        try {
          var f = new URLSearchParams(window.location.hash.slice(1));
          var token = f.get("token");
          var pair = f.get("pair");
          if (!token && !pair) return Promise.resolve();
          f.delete("token");
          f.delete("pair");
          var rest = f.toString();
          window.history.replaceState(null, "", window.location.pathname + window.location.search + (rest ? "#" + rest : ""));
          return fetch(pair ? "/pair" : "/auth/token", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(pair ? { code: pair } : { token: token }),
          }).then(function (response) {
            if (response.ok) window.location.reload();
          });
        } catch (e) {
          return Promise.resolve();
        }
      })();
      if (window.__rxAuth) {
        var native = window.fetch.bind(window);
        window.fetch = function () {
          var args = arguments;
          return window.__rxAuth.then(function () { return native.apply(null, args); });
        };
      }

      // A cloud connection otherwise waits for the whole application bundle
      // before its first cross-origin round trip. Start the one-time grant as
      // soon as the HTML is parsed so it overlaps JS/CSS download and parse.
      window.__rxRemoteBootstrap = (function () {
        try {
          var device = new URLSearchParams(window.location.search).get("device");
          if (!device) return null;
          performance.mark("reasonix:remote:start");
          return fetch("https://id.reasonix.io/me/remote-grants", {
            method: "POST",
            credentials: "include",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ targetDeviceId: device, scopes: ["desktop"] }),
          });
        } catch (e) {
          return null;
        }
      })();
    </script>
    <script>
      /* The same preference paint.ts reads, so the boot ground matches the app
         in either theme. Last paint's page and ink are stored too: a pack's own
         colours — built in or imported — are followed on the next launch. This
         must stay after the credential script: that one has to remain the first
         script in the page, or the pairing/door fetch is never armed. */
      try {
        var rxTheme = localStorage.getItem("rx-theme");
        var rxDark = rxTheme === "dark" || (rxTheme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = rxDark ? "dark" : "light";
        var rxPage = localStorage.getItem("rx-page");
        var rxInk = localStorage.getItem("rx-ink");
        if (rxPage) document.documentElement.style.setProperty("--land", rxPage);
        if (rxInk) document.documentElement.style.setProperty("--land-ink", rxInk);
      } catch (e) {}
    </script>
    <style>
      /* The boot screen owns the window from the first paint until the kernel
         answers, so it carries its own palette: tokens.css is a bundled import
         and in dev it does not exist yet. It wears the app's own page and ink,
         so the end of the boot is a fade onto the app rather than a change of
         scene. */
      :root { --land: #f0f0ed; --land-ink: #292b29 }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --land: #131513; --land-ink: #e8eae5 }
      }
      :root[data-theme="dark"] { --land: #131513; --land-ink: #e8eae5 }
      /* No background on the root: with html bare, the body's background is the
         one promoted to the canvas, and the canvas is what a theme's picture
         (body::before, z-index -2) is painted over. */
      html, body { margin: 0 }
      .boot {
        position: fixed; inset: 0; z-index: 90; overflow: hidden;
        background: var(--land);
      }
      /* Leaving is one step at one speed: the screen fades and the app beneath
         it is already painted, so the hand-over changes nothing but light. */
      .boot[data-leave] { pointer-events: none; opacity: 0; transition: opacity 240ms ease }
      .bstage { position: absolute; inset: 0; display: grid; place-items: center }
      .bmid { position: relative; display: grid; justify-items: center; gap: 22px; margin-top: -4vh; z-index: 2 }
      /* The lockup arrives by fading; nothing about it moves. */
      .blockup { display: grid; justify-items: center; gap: 3px; animation: bootcalm 220ms ease-out both }
      @keyframes bootcalm { from { opacity: 0 } to { opacity: 1 } }
      .bmark { width: min(420px, 62vw); height: auto; color: var(--land-ink); overflow: visible }
      .bmark .bl, .bmark .br { fill: currentColor }
      .bstudio {
        color: var(--land-ink); opacity: .5; letter-spacing: .22em;
        font: 500 20px/1 var(--ui, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", sans-serif);
      }
      .bline {
        margin: 0; color: var(--land-ink); letter-spacing: .05em;
        font: 400 11.5px/1 var(--ui, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", sans-serif);
        opacity: 0; transition: opacity 240ms ease 160ms;
      }
      .boot[data-wait] .bline { opacity: .55 }
      .bsteps { display: flex; gap: 20px; margin-top: 6px; opacity: 0; transition: opacity 200ms ease }
      .boot[data-wait] .bsteps { opacity: 1 }
      .bsteps i {
        width: 5px; height: 5px; border-radius: 50%; background: var(--land-ink); opacity: .25;
        transition: opacity .5s ease;
      }
      .bsteps i[data-lit] { opacity: .9 }
      /* The dot the boot is waiting on breathes, so a slow start reads as
         still working rather than stuck. */
      .bsteps i[data-now] { animation: bstep 1.2s ease-in-out infinite }
      @keyframes bstep { 0%, 100% { opacity: .25 } 50% { opacity: .75 } }
      .bline [data-en] { display: none }
      .bline [data-at] { display: none }
      .boot:not([data-step="2"]) .bline [data-at="1"], .boot[data-step="2"] .bline [data-at="2"] { display: inline }
      .bline [data-zh] { letter-spacing: 0 }
      :root:lang(en) .bline [data-en] { display: inline }
      :root:lang(en) .bline [data-zh] { display: none }
      @media (prefers-reduced-motion: reduce) {
        .blockup { animation: none }
        .boot[data-leave] { transition: none }
      }
    </style>
  </head>
