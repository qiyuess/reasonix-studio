name: Withdraw a Studio version

# Pulls a published Studio release out of the update catalog (or puts it back),
# so installs stop being offered it without waiting for a new release. Only the
# catalog changes: the release's files stay where they are, and a withdrawn
# release can be restored with the same run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to withdraw or restore, for example 2.36.0"
        required: true
        type: string
      reason:
        description: "Why it is withdrawn (shown to users on that version); ignored when restoring"
        required: false
        type: string
      restore:
        description: "Put a withdrawn version back instead of withdrawing it"
        required: false
        type: boolean
        default: false

concurrency:
  group: studio-catalog
  cancel-in-progress: false

jobs:
  withdraw:
    name: ${{ inputs.restore && 'restore' || 'withdraw' }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: studio-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: studio
          persist-credentials: false

      - name: Update the Studio catalog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
          RESTORE: ${{ inputs.restore }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like 2.36.0"
            exit 1
          fi
          # The catalog is an object on the Pages branch, not a bucket: it and
          # each version's notes and manifest are nested paths a release cannot
          # hold. Withdrawing has to land where installs read it.
          site="$RUNNER_TEMP/site"
          git clone --quiet --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$site"
          catalog="$site/studio/versions.json"
          if [ ! -f "$catalog" ]; then
            echo "::error::the site carries no catalog at studio/versions.json"
            exit 1
          fi
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$RESTORE" = "true" ]; then
            bash scripts/withdraw-version.sh "$catalog" --restore "$VERSION" "$at" > "$catalog.next"
            jq -e --arg v "$VERSION" '.versions | map(select((.version | ltrimstr("v")) == $v)) | length == 1' "$catalog.next" >/dev/null
          else
            bash scripts/withdraw-version.sh "$catalog" "$VERSION" "$REASON" "$at" > "$catalog.next"
            jq -e --arg v "$VERSION" '(.versions | map(select((.version | ltrimstr("v")) == $v)) | length == 0) and (.withdrawn | map(select((.version | ltrimstr("v")) == $v)) | length == 1)' "$catalog.next" >/dev/null
          fi
          mv "$catalog.next" "$catalog"

          cd "$site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "the catalog already reads that way for $VERSION"
            exit 0
          fi
          git commit -q -m "$([ "$RESTORE" = "true" ] && echo restore || echo withdraw): $VERSION"
          git push --quiet origin gh-pages
          echo "Studio catalog updated for $VERSION (restore=$RESTORE)"

      - name: Keep the GitHub release off the latest slot
        if: ${{ !inputs.restore }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release edit "studio-v${VERSION}" --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
