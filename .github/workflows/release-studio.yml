name: Release Studio
run-name: Release Studio ${{ inputs.tag || github.ref_name }}

# The only release line this branch publishes. It has its own tag namespace
# (studio-v*), its own environment gate, and its own rollback catalog at
# qiyuess.github.io/reasonix-studio/studio/versions.json.
#
# What it must never touch: the ROOT versions.json, which is the desktop line's
# catalog. Studio artifacts land under the tag prefix, which cannot collide
# because the tag name itself differs. The highest stable tag is the
# repository's GitHub latest and a candidate is a prerelease; the release
# carries no latest.json asset, because the flat 1.x name would collide with
# the catalog that this line's own updaters read.
#
# Windows artifacts are Authenticode-signed with a Certum SimplySign cloud
# certificate in two stages: every PE file in the application tree, then the
# installer built around them. Signing only the container leaves them unsigned on disk
# after installation, which is what reputation heuristics quarantine. The
# repository variable STUDIO_SIGNING_ENABLED=true turns it on; once on, a
# release that cannot sign does not publish.
#
# This line publishes Windows and the phone app, nothing else. Windows packages
# in two steps because the payload is signed between them, and amd64 is the only
# architecture it builds.
on:
  push:
    tags: ['studio-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing studio tag to recover (for example studio-v0.1.0)"
        required: true
        type: string

permissions:
  contents: write # create the release and upload artifacts

concurrency:
  group: release-studio-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve Studio release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      candidate: ${{ steps.release.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: release
        env:
          IN_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${IN_TAG:-$REF_NAME}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag" =~ ^studio-v(.+)$ ]] || [[ ! "${BASH_REMATCH[1]}" =~ $semver ]]; then
            echo "::error::studio release tag must be studio-vMAJOR.MINOR.PATCH[-PRERELEASE], got: $tag"
            exit 1
          fi
          # A dispatch recovers an existing tag; it must not invent one.
          sha="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          # The tag has to be on the studio line. Publishing a commit from
          # from here would produce a Studio build without Studio in it.
          if ! git merge-base --is-ancestor "$sha" origin/studio; then
            echo "::error::$tag is not on studio history"
            exit 1
          fi
          version="${tag#studio-}"
          # Semver's prerelease segment, group 4, read from the grammar rather
          # than the spelling.
          candidate=false
          if [[ "${version#v}" =~ $semver ]] && [ -n "${BASH_REMATCH[4]}" ]; then
            candidate=true
          fi
          { echo "tag=$tag"; echo "version=$version"; echo "sha=$sha"
            echo "candidate=$candidate"; } >> "$GITHUB_OUTPUT"
          echo "resolved $tag -> $version at $sha (candidate=$candidate)"

      - name: Require versioned release notes
        env:
          SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          notes="release-notes/studio/${VERSION#v}.md"
          if ! git cat-file -e "$SHA:$notes"; then
            echo "::error::$notes must exist in the tagged commit before a Studio release can build"
            exit 1
          fi

  # The contract names which branch and which workflows may reach the release
  # certificate. The call graph is read from the workflows themselves, so a
  # second workflow that learns to use the credentials fails here before
  # anything is built, and the fingerprint pins the files the signing runs.
  # Both trees are checked: the tag's, which is built, and the workflow's,
  # whose scripts do the signing.
  signing-contract:
    name: validate release signing contract
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate and fingerprint the contract
        run: |
          go run ./cmd/signpath-contract validate
          echo "release fingerprint=$(go run ./cmd/signpath-contract fingerprint)" >> "$GITHUB_STEP_SUMMARY"
          cd release-control
          go run ./cmd/signpath-contract validate
          echo "workflow fingerprint=$(go run ./cmd/signpath-contract fingerprint)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.platform }})
    needs: [resolve, signing-contract]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # The switch alone decides the path, never the presence of credentials:
      # with it on, the Windows leg hands its bundle to windows-sign-payload,
      # and a missing secret fails there instead of shipping an unsigned build.
      SIGN_WINDOWS: ${{ vars.STUDIO_SIGNING_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # ebarch is electron-builder's spelling of the same architecture, stated
        # beside the release one rather than mapped in a step: the two
        # vocabularies disagree (x64 / amd64) and a reviewer has to see both.
        # artifact is the exact name publish downloads this leg's packages by.
        # goarch and unpacked belong to the Windows leg: the release
        # architecture the package is named for, and the directory
        # electron-builder leaves its bundle in (win-unpacked for x64 alone).
        #
        # Windows is the only platform this line publishes, and amd64 the only
        # architecture on it: the release carries one installer, nothing else.
        # The macOS and Linux legs are gone rather than skipped, so nothing
        # below has a package to sign, verify or publish for them.
        include:
          - platform: windows/amd64
            runner: windows-latest
            goarch: amd64
            unpacked: win-unpacked
            artifact: studio-build-windows-amd64
    steps:
      # Real-time scanning inspects every file the job writes, and packaging
      # writes a quarter of a gigabyte twice. The runner is thrown away after
      # the job; if the image refuses the switch the build is only slower.
      - name: Stop Defender scanning the build
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # The kernel this shell ships is a main-module binary now; the desktop
      # module is not on this job's path at all.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            desktop/frontend-next/pnpm-lock.yaml
            desktop/electron/pnpm-lock.yaml

      - name: Build the SPA
        working-directory: desktop/frontend-next
        shell: bash
        run: pnpm install --frozen-lockfile && pnpm build

      # The kernel the shell speaks to. It is a main-module binary and stays
      # CGO-free, so no platform needs a toolchain for it.
      - name: Build the kernel
        working-directory: desktop/electron
        shell: bash
        # The kernel states its own version: it is the side that installs a
        # kernel on a remote machine, and those routes name a release by it.
        env:
          REASONIX_VERSION: ${{ needs.resolve.outputs.version }}
          REASONIX_GOARCH: ${{ matrix.goarch }}
        run: pnpm install --frozen-lockfile && pnpm run build:host

      # The bundle, before anything is packaged around it. The version has to be
      # injected: app.getVersion() reads package.json, which carries 0.0.0 in the
      # tree, and a shell that states 0.0.0 ranks behind every published release
      # and offers itself an update on every launch.
      - name: Build the bundle
        working-directory: desktop/electron
        shell: bash
        run: |
          version="${{ needs.resolve.outputs.version }}"
          arch=""
          if [ -n "${{ matrix.ebarch }}" ]; then arch="--${{ matrix.ebarch }}"; fi
          pnpm exec electron-builder --dir $arch -c.extraMetadata.version="${version#v}"

      # An emulated x64 program runs on ARM64 Windows, so a bundle that starts
      # proves nothing about its architecture: every PE image in it has to be
      # built for the architecture the package is named for.
      - name: Every PE image is built for the package's architecture
        if: runner.os == 'Windows'
        shell: bash
        run: node desktop/electron/packaging/pe.js "dist/${{ matrix.unpacked }}" "${{ matrix.goarch }}"

      # With signing on, this leg only hands the bundle on: the signing jobs
      # run nothing but the signer, and windows-package packages in between.
      - name: Upload the unsigned Windows bundle for signing
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-studio-windows-${{ matrix.goarch }}-bundle
          path: dist/${{ matrix.unpacked }}
          if-no-files-found: error
          retention-days: 1

      # The release carries one Windows artifact, the installer: it is the file
      # a person downloads and the one the updater runs. The portable zip is
      # gone with the other platforms, so the installer is packed on its own
      # from the bundle.
      - name: Package Windows from the bundle
        if: runner.os == 'Windows' && env.SIGN_WINDOWS != 'true'
        working-directory: desktop/electron
        shell: bash
        run: |
          version="${{ needs.resolve.outputs.version }}"
          arch="--${{ matrix.ebarch || 'x64' }}"
          pnpm exec electron-builder --prepackaged ../../dist/${{ matrix.unpacked }} --win nsis $arch \
            -c.extraMetadata.version="${version#v}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os != 'Windows' || env.SIGN_WINDOWS != 'true'
        with:
          name: ${{ matrix.artifact }}
          path: dist/ReasonixStudio-windows-*-installer.exe
          if-no-files-found: error
          retention-days: 7

  # Windows signing is four jobs so the SimplySign session is never up while
  # third-party code runs or untrusted archives are parsed: the two signing jobs
  # install no toolchain and run only the signer, while packaging and the
  # package check run between them on their own runners with no secrets. Both
  # signing jobs share one group with the Studio smoke test, so no two runs
  # drive the same SimplySign account at once.
  #
  # Each signing stage is a matrix over the Windows architectures with one tree
  # per job. max-parallel: 1 keeps the legs strictly serial, which the shared
  # certum-signing group needs: a group holds one running and one waiting job,
  # so two legs started together would have the waiting one cancelled by the
  # next arrival. A failed leg reruns alone; the others' results are kept.
  windows-sign-payload:
    name: sign the Windows PE files (Certum, ${{ matrix.arch }})
    needs: [resolve, signing-contract, build]
    if: vars.STUDIO_SIGNING_ENABLED == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      # amd64 only, following the build matrix: no arm64 Windows package exists.
      matrix:
        arch: [amd64]
    environment: studio-release
    permissions:
      contents: read
    concurrency:
      group: certum-signing
      cancel-in-progress: false
    # One output per architecture, because matrix legs share a job's output map:
    # a leg writes only its own and an empty value never replaces another's.
    # Recorded here because no later job can write this job's outputs: the
    # installer signing job refuses a payload artifact that no longer hashes to it.
    outputs:
      payload-digest-amd64: ${{ matrix.arch == 'amd64' && steps.verify.outputs.digest || '' }}
    steps:
      # Only the workflow's own commit is checked out: these jobs run the signer
      # and its checks, never anything the release tag builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      # The switch is on, so nothing below may fall back to an unsigned build.
      # Every missing value is reported under its own code before any fails.
      - name: Require Certum configuration
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
          EXPECTED_SUBJECT: ${{ vars.STUDIO_SIGNING_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          function Refuse([string]$code, [string]$message) {
            Write-Output "::error title=$code::$message"
            Set-Variable -Scope Script -Name failed -Value $true
          }
          if ([string]::IsNullOrWhiteSpace($env:CERTUM_USERNAME)) {
            Refuse 'studio-signing.missing-username' 'Secret CERTUM_USERNAME is not set'
          }
          if ($env:CERTUM_OTP_URI -notmatch '^otpauth://totp/') {
            Refuse 'studio-signing.invalid-otp-uri' 'Secret CERTUM_OTP_URI must be a complete otpauth://totp/ URI'
          }
          if ($env:CERTUM_KEY_ID -notmatch '^[0-9a-fA-F]{40}$') {
            Refuse 'studio-signing.invalid-key-id' 'Secret CERTUM_KEY_ID must be the 40-character SHA-1 certificate thumbprint'
          }
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_SUBJECT)) {
            Refuse 'studio-signing.subject-unset' 'Variable STUDIO_SIGNING_SUBJECT is empty; run the Studio Certum signing smoke test and copy the subject it reports'
          }
          if ($failed) { exit 1 }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-studio-windows-${{ matrix.arch }}-bundle
          path: signing/app

      # Stage one: every PE file in the application tree that Microsoft has
      # not signed, Electron's DLLs included. Windows loads each of them, and
      # Smart App Control judges an unsigned one on its own reputation. The
      # tree has to hold exactly the PE files the signing library declares.
      - name: List the PE files to sign
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/windows-signing-lib.ps1
          Assert-DeclaredPeSet -Root signing/app
          $script:ReleaseSignedPe | ForEach-Object { "app/$_" } | Set-Content signing/signing-files.txt
          Get-Content signing/signing-files.txt

      - name: Connect to Certum
        uses: ./.github/actions/setup-certum
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          thumbprint: ${{ secrets.CERTUM_KEY_ID }}

      - name: Sign the PE files
        shell: pwsh
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: ./scripts/sign-certum.ps1 -PayloadDirectory signing

      # The session signs for any process on the runner while it is up.
      - name: Disconnect from Certum
        if: always()
        shell: pwsh
        run: Get-Process -Name '*SimplySign*' -ErrorAction SilentlyContinue | Stop-Process -Force

      # Enumerates the tree again rather than reading the list it signed from,
      # so a PE file the list missed fails here unsigned.
      - name: Verify the signed tree
        id: verify
        shell: pwsh
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
          EXPECTED_SUBJECT: ${{ vars.STUDIO_SIGNING_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/verify-windows-authenticode.ps1 `
            -PayloadDirectory signing/app `
            -Architecture ${{ matrix.arch }} `
            -DigestPath "$env:RUNNER_TEMP/payload-digest" `
            -ExpectedThumbprint $env:CERTUM_KEY_ID `
            -ExpectedSubject $env:EXPECTED_SUBJECT
          "digest=$(Get-Content -Raw "$env:RUNNER_TEMP/payload-digest")" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-studio-windows-payload-${{ matrix.arch }}
          path: signing/app
          if-no-files-found: error
          retention-days: 1

  # No environment and no secrets: electron-builder and its dependencies run
  # here, on a runner that never held a signing session.
  windows-package:
    name: package Windows from the signed tree (${{ matrix.arch }})
    needs: [resolve, windows-sign-payload]
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            ebarch: x64
            unpacked: win-unpacked
    permissions:
      contents: read
    steps:
      - name: Stop Defender scanning the build
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/electron/pnpm-lock.yaml

      - name: Install the packager
        working-directory: desktop/electron
        shell: bash
        run: pnpm install --frozen-lockfile

      # The signed payload is the whole bundle, so it is packaged as it came.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-studio-windows-payload-${{ matrix.arch }}
          path: dist/${{ matrix.unpacked }}

      # One package comes from the signed tree, so the installer carries the
      # signed files rather than a second unsigned copy.
      - name: Package Windows from the signed bundle
        working-directory: desktop/electron
        shell: bash
        run: |
          version="${{ needs.resolve.outputs.version }}"
          pnpm exec electron-builder --prepackaged ../../dist/${{ matrix.unpacked }} --win nsis --${{ matrix.ebarch }} \
            -c.extraMetadata.version="${version#v}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-studio-windows-${{ matrix.arch }}
          path: dist/ReasonixStudio-windows-${{ matrix.arch }}-installer.exe
          if-no-files-found: error
          retention-days: 1

  # Unpacks what windows-package built and compares it with the signed payload.
  # Archive parsing happens here, on a runner with no environment and no
  # secrets, never in a job that holds the Certum credentials. Its outputs are
  # the hashes of the two files it checked, which the signing job requires.
  windows-verify-package:
    name: check the Windows packages against the signed tree (${{ matrix.arch }})
    needs: [resolve, windows-sign-payload, windows-package]
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    permissions:
      contents: read
    outputs:
      installer-sha256-amd64: ${{ matrix.arch == 'amd64' && steps.check.outputs.installer-sha256 || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-studio-windows-payload-${{ matrix.arch }}
          path: payload

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaged-studio-windows-${{ matrix.arch }}
          path: dist

      # 7-Zip is the runner image's, not the tag's.
      - name: Compare the installer with the signed payload
        id: check
        shell: pwsh
        env:
          PAYLOAD_DIGEST: ${{ needs.windows-sign-payload.outputs[format('payload-digest-{0}', matrix.arch)] }}
        run: |
          ./scripts/verify-windows-package.ps1 `
            -PayloadDirectory payload `
            -ExpectedPayloadDigest $env:PAYLOAD_DIGEST `
            -InstallerPath "dist/ReasonixStudio-windows-${{ matrix.arch }}-installer.exe" `
            -OutputPath $env:GITHUB_OUTPUT `
            -Architecture ${{ matrix.arch }}

  windows-sign-installer:
    name: sign the Windows installer (Certum, ${{ matrix.arch }})
    needs: [resolve, windows-package, windows-verify-package]
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: [amd64]
    environment: studio-release
    permissions:
      contents: read
    concurrency:
      group: certum-signing
      cancel-in-progress: false
    # The signed installer's hash, which publish requires of what it downloads.
    outputs:
      installer-sha256-amd64: ${{ matrix.arch == 'amd64' && steps.signed.outputs.installer-sha256 || '' }}
    steps:
      # Only the workflow's own commit is checked out: these jobs run the signer
      # and its checks, never anything the release tag builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      # The switch is on, so nothing below may fall back to an unsigned build.
      # Every missing value is reported under its own code before any fails.
      - name: Require Certum configuration
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
          EXPECTED_SUBJECT: ${{ vars.STUDIO_SIGNING_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          function Refuse([string]$code, [string]$message) {
            Write-Output "::error title=$code::$message"
            Set-Variable -Scope Script -Name failed -Value $true
          }
          if ([string]::IsNullOrWhiteSpace($env:CERTUM_USERNAME)) {
            Refuse 'studio-signing.missing-username' 'Secret CERTUM_USERNAME is not set'
          }
          if ($env:CERTUM_OTP_URI -notmatch '^otpauth://totp/') {
            Refuse 'studio-signing.invalid-otp-uri' 'Secret CERTUM_OTP_URI must be a complete otpauth://totp/ URI'
          }
          if ($env:CERTUM_KEY_ID -notmatch '^[0-9a-fA-F]{40}$') {
            Refuse 'studio-signing.invalid-key-id' 'Secret CERTUM_KEY_ID must be the 40-character SHA-1 certificate thumbprint'
          }
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_SUBJECT)) {
            Refuse 'studio-signing.subject-unset' 'Variable STUDIO_SIGNING_SUBJECT is empty; run the Studio Certum signing smoke test and copy the subject it reports'
          }
          if ($failed) { exit 1 }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaged-studio-windows-${{ matrix.arch }}
          path: dist

      # Only the file windows-verify-package checked, byte for byte. This job
      # opens no archive: what is inside was settled on a runner without the
      # credentials, so Certum never signs an installer that did not match.
      - name: Require the checked package
        shell: pwsh
        env:
          INSTALLER_SHA256: ${{ needs.windows-verify-package.outputs[format('installer-sha256-{0}', matrix.arch)] }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = [ordered]@{
            'ReasonixStudio-windows-${{ matrix.arch }}-installer.exe' = $env:INSTALLER_SHA256
          }
          $present = @(Get-ChildItem -LiteralPath dist -Recurse -Force | ForEach-Object { $_.Name })
          if (Compare-Object -CaseSensitive @($expected.Keys) $present) { throw "dist holds $($present -join ', ')" }
          foreach ($entry in $expected.GetEnumerator()) {
            if ($entry.Value -notmatch '^[0-9a-f]{64}$') { throw "No checked hash for $($entry.Key)" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path dist $entry.Key)).Hash.ToLowerInvariant()
            if ($hash -cne $entry.Value) { throw "$($entry.Key) is not the file windows-verify-package checked" }
          }

      - name: Connect to Certum
        uses: ./.github/actions/setup-certum
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          thumbprint: ${{ secrets.CERTUM_KEY_ID }}

      # Stage two: the NSIS container, only once the payload inside it is signed.
      - name: Sign the installer
        shell: pwsh
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: ./scripts/sign-certum.ps1 -FilePath dist/ReasonixStudio-windows-${{ matrix.arch }}-installer.exe

      # The session signs for any process on the runner while it is up.
      - name: Disconnect from Certum
        if: always()
        shell: pwsh
        run: Get-Process -Name '*SimplySign*' -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Verify the installer signature
        id: signed
        shell: pwsh
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
          EXPECTED_SUBJECT: ${{ vars.STUDIO_SIGNING_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = 'dist/ReasonixStudio-windows-${{ matrix.arch }}-installer.exe'
          ./scripts/verify-windows-authenticode.ps1 `
            -FilePath $installer `
            -ExpectedThumbprint $env:CERTUM_KEY_ID `
            -ExpectedSubject $env:EXPECTED_SUBJECT
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "installer-sha256=$hash" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-windows-signed-${{ matrix.arch }}
          path: dist/ReasonixStudio-*
          if-no-files-found: error
          retention-days: 7

  # Installs each Windows installer where it is meant to run (the same script
  # the Studio workflow runs on pull requests, against the unsigned installer).
  # The package check unpacks with the runner's modern 7-Zip, which reads
  # archives the NSIS extractor cannot, so only running the installer shows that
  # it installs every executable. No environment and no secrets.
  windows-install-smoke:
    name: install the Windows package (${{ matrix.arch }})
    needs: [resolve, build, windows-sign-installer]
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success' && needs.build.result == 'success' &&
      (needs.windows-sign-installer.result == 'success' ||
      (vars.STUDIO_SIGNING_ENABLED != 'true' && needs.windows-sign-installer.result == 'skipped')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.windows-sign-installer.result == 'success'
        with:
          name: studio-windows-signed-${{ matrix.arch }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.windows-sign-installer.result != 'success'
        with:
          name: studio-build-windows-${{ matrix.arch }}
          path: dist

      - name: Install, check and uninstall
        shell: pwsh
        run: |
          ./scripts/install-smoke.ps1 `
            -Installer "dist/ReasonixStudio-windows-${{ matrix.arch }}-installer.exe" `
            -Architecture ${{ matrix.arch }}

  # The kernel a Studio installs on another machine. This line publishes it
  # under its own tag, because the install routes name a release by the version
  # the local build reports — and a line that ships no archive leaves every one
  # of them with nothing to name but npm's, which is another line's.
  cli:
    name: build the CLI archives
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # The page every archive carries beside the executable, built once here
      # rather than once per target: serve.FindPage looks for
      # frontend-next/dist next to the binary.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend-next/pnpm-lock.yaml

      - name: Build the page
        working-directory: desktop/frontend-next
        run: pnpm install --frozen-lockfile && pnpm build

      # Every target the release line claims to support, from one runner: the
      # CLI is CGO-free, so none of them needs a toolchain of its own.
      - name: Cross-compile and archive
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PAGE_DIR: desktop/frontend-next/dist
        run: |
          set -euo pipefail
          mkdir -p dist
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pkg=reasonix/internal/tools/productdocs
          # Windows ships amd64 and nothing else: no reasonix-windows-arm64.zip
          # is built, and requiredCLIAssets no longer expects one.
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -X main.gitCommit=${SHA:0:12} -X main.buildTimeUTC=$built -X $pkg.linkedVersion=$VERSION -X $pkg.linkedRevision=$SHA" \
              -o "reasonix$ext" ./cmd/reasonix
            scripts/package-cli-archive.sh "$os" "$arch" "reasonix$ext" "$PAGE_DIR" dist
            rm -f "reasonix$ext"
          done
          # The digest list the remote verifies against. Resolved on the
          # installing machine and handed to the remote with the URL, so the
          # host fetching the archive never also supplies its own checksum.
          (cd dist && sha256sum reasonix-* > SHA256SUMS)
          ls -la dist

      # A release that published the archives without the digest list is worse
      # than one that published neither: the routes resolve SHA256SUMS first.
      - name: Check the set is complete
        run: python3 scripts/check-cli-archives.py dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-archives
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # The phone app is built here rather than by its own repository, so one tag
  # publishes both halves of the product: the Windows installer and the APK.
  # The phone project keeps its own version numbering, and that is the name the
  # APK carries, because the in-app updater resolves the file by it.
  android:
    name: build the Android APK
    needs: [resolve, signing-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.3.0

      - name: Install the phone app
        working-directory: mobile
        run: npm ci

      - name: Build the web bundle
        working-directory: mobile
        run: npm run build

      - name: Copy the web bundle into the Android shell
        working-directory: mobile
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android

      # gradle's verifyReleaseSigning task fails the build when this is missing,
      # so a release never carries an APK nobody can install over the last one.
      - uses: ./.github/actions/restore-android-keystore
        with:
          keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          store_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build the signed release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - name: Verify the signature
        working-directory: mobile/android
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      # The updater resolves this exact name from the phone project's
      # latest.json, so the two must be written from the same version.
      - name: Name the asset
        id: apk
        run: |
          set -euo pipefail
          version="$(node -p "require('./mobile/package.json').version")"
          asset="reasonix-for-android-${version}.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l "$asset"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: reasonix-for-android-*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: sign, publish and mirror
    needs: [resolve, build, android, windows-sign-payload, windows-package, windows-verify-package, windows-sign-installer, windows-install-smoke]
    # The Windows signing jobs may be skipped only while the switch is off; with
    # it on, any of them failing, cancelled or absent blocks the release. The
    # phone app is part of the same release, so a failed APK blocks it too.
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success' && needs.build.result == 'success' &&
      needs.android.result == 'success' &&
      needs.windows-install-smoke.result == 'success' &&
      ((needs.windows-sign-payload.result == 'success' &&
      needs.windows-package.result == 'success' && needs.windows-verify-package.result == 'success' &&
      needs.windows-sign-installer.result == 'success') ||
      (vars.STUDIO_SIGNING_ENABLED != 'true' && needs.windows-sign-payload.result == 'skipped' &&
      needs.windows-package.result == 'skipped' && needs.windows-verify-package.result == 'skipped' &&
      needs.windows-sign-installer.result == 'skipped')) }}
    runs-on: ubuntu-latest
    # Owner approval for the whole line. The gate sits here rather than before
    # build so the approval is given with the artifacts already proven to build.
    environment: studio-release
    permissions:
      contents: write
      issues: read # release-notes credits read PR and issue authors
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      # Before signing, so a credit lookup GitHub cannot answer stops the
      # release while nothing has been published.
      - name: Render version notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          version_notes="release-notes/studio/${VERSION#v}.md"
          if [ -f "$version_notes" ]; then
            node scripts/studio-release-notes.mjs "$version_notes" "$RUNNER_TEMP/version-notes.md"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      # One directory per artifact, because both sets below are taken from the
      # job that produced them. Merging them flattens that away, and the name
      # alone cannot tell a package apart from an input to signing it.
      # Every package by its exact name, never a pattern: any job without
      # secrets can upload an artifact, and a pattern would publish it. Windows
      # comes from the installer signing job when it ran, else the build leg.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.windows-sign-installer.result == 'success'
        with:
          name: studio-windows-signed-amd64
          path: staging/studio-windows-amd64

      # Any job can upload an artifact, so the signed Windows package is taken
      # only if it is the bytes the signing job recorded.
      - name: Require the recorded Windows package
        if: needs.windows-sign-installer.result == 'success'
        env:
          INSTALLER_SHA256_AMD64: ${{ needs.windows-sign-installer.outputs[format('installer-sha256-{0}', 'amd64')] }}
        run: |
          check() {
            local file="$1/$2" want="$3" got
            if [[ ! "$want" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error title=studio-signing.package-hash-missing::no recorded SHA-256 for $2"
              return 1
            fi
            got="$(sha256sum "$file" | awk '{print $1}')" || return 1
            if [ "$got" != "$want" ]; then
              echo "::error title=studio-signing.package-hash-mismatch::$2 is $got, the signing jobs recorded $want"
              return 1
            fi
          }
          # Windows is amd64 only, and the installer is the only package the
          # release carries. The loop stays a loop so re-adding an architecture
          # is a one-line change here too.
          for arch in amd64; do
            dir="staging/studio-windows-$arch"
            files="$(cd "$dir" && find . -type f | sed 's|^\./||' | LC_ALL=C sort | tr '\n' ' ')"
            if [ "$files" != "ReasonixStudio-windows-$arch-installer.exe " ]; then
              echo "::error title=studio-signing.package-set-mismatch::studio-windows-signed-$arch holds: $files"
              exit 1
            fi
            upper="${arch^^}"
            installer="INSTALLER_SHA256_$upper"
            check "$dir" "ReasonixStudio-windows-$arch-installer.exe" "${!installer}"
          done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.windows-sign-installer.result != 'success'
        with:
          name: studio-build-windows-amd64
          path: staging/studio-windows-amd64

      # The phone app's own version, not the Studio one: the in-app updater
      # resolves the APK by the name the phone project gives it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: staging/android-apk

      - name: Collect artifacts
        run: |
          mkdir -p dist
          # The installer from the build and signing jobs, then the APK. The CLI
          # archives are built for the remote-kernel route and are not part of
          # this release: a page offering them beside the installer only asks
          # the reader which one to take. Two artifacts carrying one file name
          # fail the release rather than letting move order pick.
          while IFS= read -r -d '' f; do
            name="$(basename "$f")"
            if [ -e "dist/$name" ]; then
              echo "::error::$name arrived in more than one artifact"
              exit 1
            fi
            mv "$f" "dist/$name"
          done < <(find staging/studio-* -type f -name 'ReasonixStudio-*' -print0
            find staging/android-apk -type f -name 'reasonix-for-android-*.apk' -print0)
          ls -la dist
          bash scripts/verify-studio-artifacts.sh dist
          # The APK travels with the release; requiring it here means a release
          # that lost the phone build cannot publish a half product.
          test -n "$(find dist -maxdepth 1 -name 'reasonix-for-android-*.apk' -print -quit)" || {
            echo "::error::no reasonix-for-android-*.apk in dist" >&2; exit 1; }

      # The same minisign key the desktop line uses, because the public key that
      # verifies it is compiled into the client (update.PublicKey).
      - name: Sign
        working-directory: desktop
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          go run ./cmd/sign sign ../dist/ReasonixStudio-*
          for f in ../dist/ReasonixStudio-*; do
            case "$f" in *.minisig) continue ;; esac
            go run ./cmd/sign verify "$f"
          done

      # A chunked update was cut from the portable archive, which this line no
      # longer builds: one installer carries the whole shell, so there is no
      # second file to diff against.
      #
      # The manifest is served from the mirror only, so a release that cannot
      # reach it publishes the GitHub release alone rather than pointing at a
      # mirror nobody uploaded.
      - name: Generate manifest
        working-directory: desktop
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          go run ./cmd/studio-manifest ../dist "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.tag }}"

      # The manifest stays out of the GitHub release (it is mirrored to R2
      # under <tag>/ below), and a stable release takes the repository's latest
      # only when it is the highest stable studio tag.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SIGNED_WINDOWS: ${{ needs.windows-sign-installer.result == 'success' }}
        run: |
          # A version's own notes live in release-notes/studio/<semver>.md, named
          # without the v the tag carries, and were rendered with their authors
          # above. The release still publishes without one, carrying only the
          # standing text.
          version_notes="release-notes/studio/${VERSION#v}.md"
          notes="$RUNNER_TEMP/release-notes.md"
          : > "$notes"
          if [ -f "$version_notes" ]; then
            # The GitHub page is read in Chinese only: it has no language
            # switch, so the English half would double its length. The mirror
            # object keeps both halves below, because the Versions panel
            # switches language on the <!-- lang:en --> marker.
            node scripts/studio-notes-zh.mjs "$RUNNER_TEMP/version-notes.md" "$notes"
          else
            echo "::error::no $version_notes; every Studio release requires user-visible notes"
            exit 1
          fi
          # An earlier Studio tag is what lets GitHub generate the change list.
          # This repository's first release has none: the version notes and the
          # standing text below are the whole body, so the generated list is
          # skipped rather than the release refused.
          previous_tag="$(git tag --merged "${{ needs.resolve.outputs.sha }}" --sort=-version:refname 'studio-v*' | grep -Fxv "$TAG" | head -n 1)"
          if [ -n "$previous_tag" ]; then
            gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f previous_tag_name="$previous_tag" \
              --jq '.body' >> "$notes"
            printf '\n\n' >> "$notes"
          else
            echo "::notice::no earlier studio tag; this release's notes carry no generated change list"
          fi
          # The Windows sentence follows the job that signed, not the switch
          # that asked for it: a constant here tells users to click through
          # SmartScreen for a signed package, or the reverse.
          if [ "$SIGNED_WINDOWS" = "true" ]; then
            windows='**Windows** 的窗口、内核与安装器都经 Certum 代码签名证书做了 Authenticode 签名。'
          else
            windows='**Windows 包未签名**，SmartScreen 会告警：选「更多信息」，再选「仍要运行」。'
          fi
          {
            printf '%s\n\n' '---'
            printf "**Windows** 下载 \`ReasonixStudio-windows-amd64-installer.exe\` 安装即可，x86_64 与 ARM64 的 Windows 都能运行。%s\n\n" "$windows"
            # The APK carries the phone project's version, which is its own
            # number: naming it from the Studio version would point at a file
            # this release does not carry.
            apk="$(basename "$(find dist -maxdepth 1 -name 'reasonix-for-android-*.apk' -print -quit)")"
            printf "%s\n" "**手机端** 下载 \`$apk\`，或在应用内「设置 → 偏好 → 关于」直接检查更新。"
          } >> "$notes"
          assets=()
          for f in dist/*; do
            case "$(basename "$f")" in
              # The manifest and the signatures are published to the site, not
              # the release: the page carries what a person downloads, and a
              # .minisig is read by the updater only.
              latest.json|*.minisig) continue ;;
            esac
            assets+=("$f")
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes"
            gh release upload "$TAG" "${assets[@]}" --clobber
            # Re-pushing a tag turns its release into a draft GitHub names
            # untagged-*, and `gh release edit` neither undrafts it nor drops an
            # asset this release no longer builds. Both are repaired here, so a
            # rerun of the same tag publishes exactly what this run produced.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release edit "$TAG" --draft=false
            fi
            keep="$(printf '%s\n' "${assets[@]}" | xargs -n1 basename | sort)"
            gh release view "$TAG" --json assets --jq '.assets[].name' | sort | while IFS= read -r name; do
              [ -n "$name" ] || continue
              if ! printf '%s\n' "$keep" | grep -Fxq -- "$name"; then
                echo "removing $name: this release does not build it"
                gh release delete-asset "$TAG" "$name" --yes
              fi
            done
          else
            decided="$(git tag -l 'studio-v*' | bash scripts/studio-release-flags.sh "$TAG" "$CANDIDATE")"
            mapfile -t flags <<<"$decided"
            gh release create "$TAG" "${assets[@]}" \
              --title "Reasonix Studio $VERSION" \
              --notes-file "$notes" \
              "${flags[@]}"
          fi

      # The catalog, each version's notes and its manifest are nested paths, and
      # a GitHub release cannot hold one: /releases/download addresses a single
      # tag and a single flat file name. They go to the Pages branch instead,
      # which is the host StudioPublish names in the client.
      - name: Publish the update catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          git clone --quiet --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$site"
          mkdir -p "$site/studio/notes" "$site/$TAG"

          # Immutable per version: a published manifest and its notes never
          # change, so a rerun writes the same bytes and commits nothing. The
          # signatures travel with the manifest, not the release: a reader never
          # opens one, and the release page should carry only what someone takes.
          cp dist/latest.json "$site/$TAG/latest.json"
          cp dist/*.minisig "$site/$TAG/"
          cp "$RUNNER_TEMP/version-notes.md" "$site/studio/notes/${VERSION#v}.md"

          catalog="$site/studio/versions.json"
          if [ "$CANDIDATE" = "true" ]; then
            echo "::notice::$TAG is a candidate: its manifest and notes are published, the catalog is not"
          else
            source=-
            if [ -f "$catalog" ]; then
              source="$catalog"
            else
              echo "no existing catalog; starting a new one"
            fi
            bash scripts/update-versions-index.sh "$source" "$VERSION" "$TAG" studio \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 20 \
              "https://qiyuess.github.io/reasonix-studio/studio/notes/${VERSION#v}.md" > "$catalog.next"
            jq -e --arg v "$VERSION" \
              '.versions | map(select(.version == $v)) | length == 1' "$catalog.next" >/dev/null
            mv "$catalog.next" "$catalog"
            echo "catalog -> $VERSION"
          fi

          cd "$site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "the site already carries $TAG"
            exit 0
          fi
          git commit -q -m "release: $TAG"
          git push --quiet origin gh-pages

  website:
    name: publish the Studio website changelog
    needs: [resolve, publish]
    if: github.repository == 'esengine/DeepSeek-Reasonix' && needs.resolve.outputs.candidate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
      - name: Deploy and verify the website changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash scripts/publish-studio-changelog.sh

  # A CLI channel that moves while 1.x still publishes would have two lines
  # writing it, so every CLI job waits for this check. It runs no repository code.
  cli-gate:
    name: require the 1.x line to be frozen
    needs: resolve
    if: vars.STUDIO_PUBLISHES_CLI == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require CLI_PUBLISH_FROZEN
        env:
          CLI_PUBLISH_FROZEN: ${{ vars.CLI_PUBLISH_FROZEN }}
        run: |
          if [ "$CLI_PUBLISH_FROZEN" != true ]; then
            echo "::error::STUDIO_PUBLISHES_CLI is on but CLI_PUBLISH_FROZEN is not: freeze the 1.x line first, or two lines would write the CLI channels"
            exit 1
          fi

  # The v<version> tag the update pointer needs is created here, by the release
  # identity the 1.x line also uses, because only that identity may create v*
  # tags. This job checks out nothing and runs no repository code; the one step
  # that reads RELEASE_TAG_TOKEN is written inline and only runs on the studio
  # tag or branch, through the studio-release environment's ref policy.
  cli-tag:
    name: create the CLI tag
    needs: [resolve, publish, cli-gate]
    if: vars.STUDIO_PUBLISHES_CLI == 'true'
    runs-on: ubuntu-latest
    environment: studio-release
    permissions:
      contents: read
    steps:
      - name: Create v<version> on the studio commit
        env:
          TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
          RELEASE_TAG_ACTOR: ${{ vars.RELEASE_TAG_ACTOR }}
          READ_TOKEN: ${{ github.token }}
          CLI_PUBLISH_FROZEN: ${{ vars.CLI_PUBLISH_FROZEN }}
          STUDIO_TAG: ${{ needs.resolve.outputs.tag }}
          CLI_VERSION: ${{ needs.resolve.outputs.version }}
          APPROVED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          repo=esengine/DeepSeek-Reasonix
          stable_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          preview_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.(0|[1-9][0-9]*)$'
          tag="v${CLI_VERSION#v}"
          if [[ ! "$tag" =~ $stable_re && ! "$tag" =~ $preview_re ]]; then
            echo "$tag publishes no CLI pointer; no tag is created"
            exit 0
          fi
          [ "$CLI_PUBLISH_FROZEN" = true ] || { echo "::error::CLI_PUBLISH_FROZEN must be true"; exit 1; }
          [ "$GITHUB_REPOSITORY" = "$repo" ] || { echo "::error::the release tag identity is only used in $repo"; exit 1; }
          case "$GITHUB_REF" in
            refs/tags/studio-v* | refs/heads/studio) ;;
            *) echo "::error::the release tag identity is only used on a studio tag or the studio branch, not $GITHUB_REF"; exit 1 ;;
          esac
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::approved SHA is not a full commit SHA"; exit 1; }
          [[ "$STUDIO_TAG" == "studio-$CLI_VERSION" ]] || { echo "::error::studio tag does not match the version"; exit 1; }
          [ -n "$TAG_TOKEN" ] || { echo "::error::RELEASE_TAG_TOKEN is not configured; the default Actions token cannot create v* tags"; exit 1; }
          [[ "$RELEASE_TAG_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]] || { echo "::error::configure RELEASE_TAG_ACTOR with the tag publisher's login"; exit 1; }
          read_api() { GH_TOKEN="$READ_TOKEN" gh api "$@"; }
          write_api() { GH_TOKEN="$TAG_TOKEN" gh api "$@"; }
          actor="$(write_api user)"
          jq -e --arg login "$RELEASE_TAG_ACTOR" '.type == "User" and (.login | ascii_downcase) == ($login | ascii_downcase)' <<<"$actor" >/dev/null ||
            { echo "::error::the release tag credential does not identify RELEASE_TAG_ACTOR"; exit 1; }
          [ "$(write_api "repos/$repo" --jq .permissions.push)" = true ] ||
            { echo "::error::the release tag identity cannot push to $repo"; exit 1; }
          [ "$(read_api "repos/$repo/commits/$STUDIO_TAG" --jq .sha)" = "$APPROVED_SHA" ] ||
            { echo "::error::$STUDIO_TAG does not resolve to $APPROVED_SHA"; exit 1; }
          case "$(read_api "repos/$repo/compare/studio...$APPROVED_SHA" --jq .status)" in
            behind | identical) ;;
            *) echo "::error::$APPROVED_SHA is not on studio history"; exit 1 ;;
          esac
          # Prints the commit the tag points at; status 1 only when the tag does not exist.
          tag_commit() {
            local ref kind sha
            ref="$(read_api "repos/$repo/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' 2>"$RUNNER_TEMP/tag.error")" || {
              grep -Eiq '404|Not Found' "$RUNNER_TEMP/tag.error" && return 1
              cat "$RUNNER_TEMP/tag.error" >&2
              exit 1
            }
            read -r kind sha <<<"$ref"
            [ "$kind" != tag ] || sha="$(read_api "repos/$repo/git/tags/$sha" --jq .object.sha)"
            echo "$sha"
          }
          if existing="$(tag_commit)"; then
            [ "$existing" = "$APPROVED_SHA" ] || { echo "::error::$tag already exists on $existing, not $APPROVED_SHA"; exit 1; }
            echo "$tag already points at $APPROVED_SHA"
            exit 0
          fi
          if ! write_api "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$APPROVED_SHA" >/dev/null 2>"$RUNNER_TEMP/create.error"; then
            # A concurrent run may have created the same tag in the meantime.
            if existing="$(tag_commit)" && [ "$existing" = "$APPROVED_SHA" ]; then
              echo "$tag already points at $APPROVED_SHA"
              exit 0
            fi
            cat "$RUNNER_TEMP/create.error" >&2
            exit 1
          fi
          echo "created $tag at $APPROVED_SHA"

  # The CLI's install channels, npm's `reasonix` and the Homebrew tap. The 1.x
  # line owns them until this one takes the CLI over; the repository variable
  # STUDIO_PUBLISHES_CLI=true hands them here. They run once cli-pointer has
  # created the CLI release, because the cask points at its archives. A candidate
  # goes to npm's `next` tag and leaves the tap alone: brew has no prerelease
  # channel, so a candidate cask would become the default install.
  cli-channels:
    name: publish the CLI to npm and Homebrew
    needs: [resolve, publish, cli-gate, cli-tag, cli-pointer]
    if: vars.STUDIO_PUBLISHES_CLI == 'true'
    runs-on: ubuntu-latest
    # id-token lets npm publish --provenance attach a Sigstore attestation; the
    # registry token still authenticates the publish itself.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: node npm/build.mjs "$VERSION" --publish
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.resolve.outputs.candidate != 'true'
        with:
          name: cli-archives
          path: cli-archives
      - name: Update the Homebrew cask
        if: needs.resolve.outputs.candidate != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/esengine/homebrew-reasonix.git" tap
          decision="$(node scripts/brew-cask-guard.mjs tap/Casks/reasonix.rb "${VERSION#v}")"
          case "$decision" in
            write) ;;
            skip)
              echo "the tap's cask is newer than ${VERSION#v}; leaving it"
              exit 0
              ;;
            *)
              echo "::error::unexpected cask guard decision: '$decision'"
              exit 1
              ;;
          esac
          bash scripts/render-brew-cask.sh "${VERSION#v}" "$TAG" cli-archives/SHA256SUMS > tap/Casks/reasonix.rb
          cd tap
          git add Casks/reasonix.rb
          if git diff --cached --quiet; then
            echo "cask already at ${VERSION#v}"
            exit 0
          fi
          git -c user.name=reasonix -c user.email=reasonix@deepseek.com commit -m "reasonix ${VERSION#v}"
          git push origin HEAD:main

  # The 1.x updater accepts only a release tagged vMAJOR.MINOR.PATCH whose assets
  # sit under that tag, so the archives go to a v<version> release. Only a
  # -preview.N version moves preview; other prereleases publish nothing.
  cli-pointer:
    name: publish the CLI update pointer
    needs: [resolve, publish, cli-gate, cli-tag]
    if: vars.STUDIO_PUBLISHES_CLI == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: studio-cli-pointer-${{ contains(needs.resolve.outputs.version, '-') && 'preview' || 'stable' }}
      cancel-in-progress: false
    permissions:
      contents: write # create the CLI release; cli-tag has already made its tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-archives
          path: cli-archives
      - name: Publish the release, its record and the pointer
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_VERSION: ${{ needs.resolve.outputs.version }}
          CLI_PUBLISH_FROZEN: ${{ vars.CLI_PUBLISH_FROZEN }}
          APPROVED_SHA: ${{ needs.resolve.outputs.sha }}
          STUDIO_TAG: ${{ needs.resolve.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          ARCHIVES_DIR: cli-archives
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_ACCOUNT_ID != '' && secrets.R2_BUCKET != '' }}
        run: |
          if [ "$HAS_R2" != "true" ]; then
            echo "::error::R2 credentials are not configured; the CLI pointer was not written"
            exit 1
          fi
          bash scripts/publish-cli-pointer.sh
